<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scord - Gestão de Louvor e Repertório</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="Scord.png" />
  <meta name="theme-color" content="#0b1120" />
  <link rel="apple-touch-icon" href="Scord.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scord" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-28 selection:bg-indigo-500 selection:text-white relative">
  <!-- Container Responsivo: max-w-md no mobile, expande até max-w-6xl no notebook/PC -->
  <div class="max-w-md md:max-w-4xl lg:max-w-6xl mx-auto px-4 sm:px-6 pt-6">

    <!-- Cabeçalho -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-800/80">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-slate-900 border border-slate-700/60 flex items-center justify-center overflow-hidden shrink-0 shadow-inner">
          <img 
            src="Scord.png" 
            alt="Logo Scord" 
            class="w-full h-full object-contain p-1.5"
            onerror="this.onerror=null; this.parentElement.innerHTML='<i data-lucide=\'music\' class=\'w-5 h-5 text-indigo-400\'></i>'; lucide.createIcons();" 
          />
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white leading-tight">Scord</h1>
          <p class="text-xs text-slate-400 font-medium">Escala e Repertório</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="abrirModalConsultaEscala()" title="Consultar Escala do Mês" class="w-9 h-9 rounded-xl bg-indigo-950/60 border border-indigo-500/30 hover:bg-indigo-900/50 text-indigo-400 active:scale-95 transition flex items-center justify-center">
          <i data-lucide="calendar-days" class="w-4 h-4"></i>
        </button>
        <button onclick="alternarModoAdmin()" id="btn-lock" title="Acesso da Liderança" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/60 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center">
          <i data-lucide="lock" id="icon-lock" class="w-4 h-4 text-slate-400"></i>
        </button>
        <button onclick="carregarRepertorio(true)" title="Recarregar dados" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/60 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center">
          <i data-lucide="rotate-cw" id="icon-refresh" class="w-4 h-4 text-slate-300"></i>
        </button>
      </div>
    </header>

    <!-- Filtro de Mês -->
    <div class="mt-4 flex items-center justify-between bg-slate-900/90 border border-slate-800 p-2 rounded-xl">
      <span class="text-xs font-semibold text-slate-400 pl-2 flex items-center gap-1.5">
        <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-400"></i>
        Mês:
      </span>
      <select id="seletor-mes" onchange="mudarMes(this.value)" class="bg-slate-800 text-slate-200 text-xs font-semibold rounded-lg px-3 py-1.5 border border-slate-700 outline-none focus:border-indigo-500 transition">
      </select>
    </div>

    <!-- Barra de Filtros -->
    <div class="flex gap-2 overflow-x-auto py-3 no-scrollbar items-center" id="container-filtros">
      <button onclick="filtrarDia('PROXIMO')" data-filtro="PROXIMO" id="btn-filtro-proximo" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow-sm whitespace-nowrap transition flex items-center gap-1.5">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-200"></i>
        <span id="label-proximo">Próximo Culto</span>
      </button>
      <button onclick="filtrarDia('TODOS')" data-filtro="TODOS" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition">
        Todos
      </button>
      <button onclick="filtrarDia('Quinta')" data-filtro="Quinta" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition">
        Quintas
      </button>
      <button onclick="filtrarDia('Sábado')" data-filtro="Sábado" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition">
        Sábados
      </button>
      <button onclick="filtrarDia('Domingo')" data-filtro="Domingo" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition">
        Domingos
      </button>
    </div>

    <!-- Lista Principal -->
    <main id="lista-musicas" class="space-y-8 pt-1">
      <div class="text-center py-16 text-slate-500 text-sm">
        <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2.5 text-indigo-400"></i>
        Buscando...
      </div>
    </main>
  </div>

  <!-- Barra Flutuante da Liderança (Modo Admin) -->
  <div id="painel-botoes-admin" class="hidden fixed bottom-6 inset-x-0 mx-auto max-w-sm z-40 flex items-center justify-center gap-2 px-3">
    <button onclick="abrirModalMembros()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold py-3 px-2 rounded-2xl shadow-xl flex items-center justify-center gap-1.5 text-xs active:scale-95 transition">
      <i data-lucide="users" class="w-3.5 h-3.5 text-sky-400"></i>
      Músicos
    </button>
    <button onclick="abrirModalEscalarMusico()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-2 rounded-2xl shadow-xl flex items-center justify-center gap-1.5 text-xs active:scale-95 transition">
      <i data-lucide="calendar-check" class="w-3.5 h-3.5"></i>
      Criar Escala
    </button>
    <button onclick="abrirModalNovoLouvor()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-2 rounded-2xl shadow-xl flex items-center justify-center gap-1.5 text-xs border border-indigo-400/30 active:scale-95 transition">
      <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
      Louvor
    </button>
  </div>

  <!-- Modal 1: Consultar Escala do Mês (Para Músicos) -->
  <div id="modal-consulta-escala" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm p-4 overflow-y-auto flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl relative my-8">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div>
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="calendar-days" class="w-4 h-4 text-indigo-400"></i>
            Escala do Mês
          </h3>
          <p id="label-mes-consulta-sub" class="text-[11px] text-indigo-400 font-medium"></p>
        </div>
        <button onclick="fecharModalConsultaEscala()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="mt-4 flex items-center gap-2">
        <div class="flex-1">
          <label class="block text-xs font-semibold text-slate-300 mb-1">Filtrar por Músico:</label>
          <select id="seletor-filtro-musico" onchange="renderizarVisualizacaoEscalaMensal()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none focus:border-indigo-500">
          </select>
        </div>
        <div id="container-btn-zap-consulta" class="hidden pt-5">
          <button onclick="dispararZapEscalaFiltrada()" title="Enviar escala no WhatsApp" class="w-9 h-9 rounded-xl bg-emerald-950/70 border border-emerald-500/40 hover:bg-emerald-900/60 active:scale-95 transition flex items-center justify-center shrink-0">
            <img src="whatsapp.png" alt="WhatsApp" class="w-5 h-5 object-contain" />
          </button>
        </div>
      </div>

      <div id="container-dias-escala-mensal" class="mt-4 space-y-2.5 max-h-72 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- Modal 2: Criar / Atribuir Escala Mensal -->
  <div id="modal-escalar-musico" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm p-4 overflow-y-auto flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl relative my-8">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="calendar-check" class="w-4 h-4 text-amber-400"></i>
          Atribuir Escala Mensal
        </h3>
        <button onclick="fecharModalEscalarMusico()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-escalar-musico" onsubmit="salvarEscalaMusicoMes(event)" class="space-y-3 mt-4 text-xs">
        <div>
          <label class="block text-slate-300 font-semibold mb-1">Selecione o Integrante *</label>
          <select id="escala-nome-membro" onchange="atualizarChecksMusicoSelecionado()" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500">
          </select>
        </div>

        <div class="pt-2 border-t border-slate-800">
          <div class="flex items-center justify-between mb-2">
            <label class="block text-slate-300 font-semibold">Marque os Cultos e Funções:</label>
            <span class="text-[10px] text-indigo-400 font-medium" id="label-mes-alvo-escala"></span>
          </div>
          <div id="container-dias-para-marcar" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
        </div>

        <div class="flex items-center gap-2 mt-4">
          <button type="submit" id="btn-submit-escala-mes" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl shadow-lg transition flex items-center justify-center gap-1.5">
            <i data-lucide="check" class="w-4 h-4"></i>
            Salvar Escala do Músico
          </button>
          <button type="button" onclick="enviarEscalaPrivadoSelecionado()" title="Enviar escala no WhatsApp deste integrante" class="w-10 h-10 rounded-xl bg-emerald-950/70 border border-emerald-500/40 hover:bg-emerald-900/60 active:scale-95 transition flex items-center justify-center shrink-0">
            <img src="whatsapp.png" alt="WhatsApp" class="w-5 h-5 object-contain" />
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 3: Editar Equipe do Culto (Ajuste Rápido no Dia) -->
  <div id="modal-editar-equipe-dia" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm p-4 overflow-y-auto flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl relative my-8">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div>
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="users" class="w-4 h-4 text-emerald-400"></i>
            Editar Equipe
          </h3>
          <p id="label-equipe-dia-edicao" class="text-xs text-indigo-400 font-medium"></p>
        </div>
        <button onclick="fecharModalEditarEquipeDia()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="mt-4">
        <span class="text-xs font-semibold text-slate-300 block mb-2">Escala de Músicos deste Culto:</span>
        <div id="lista-membros-equipe-dia" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>
        <button onclick="salvarAlteracaoEquipeDia()" id="btn-salvar-equipe-dia" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-lg">
          <i data-lucide="check" class="w-4 h-4"></i>
          Atualizar Equipe
        </button>
      </div>
    </div>
  </div>

  <!-- Modal 4: Novo Louvor (com Observações) -->
  <div id="modal-louvor" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm p-4 overflow-y-auto flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl relative my-8">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="music-4" class="w-4 h-4 text-indigo-400"></i>
          Novo Louvor
        </h3>
        <button onclick="fecharModalLouvor()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-louvor" onsubmit="salvarNovoLouvor(event)" class="space-y-3.5 mt-4 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="min-w-0">
            <label class="block text-slate-300 font-semibold mb-1">Data do Culto *</label>
            <input type="date" id="input-data" required onchange="calcularDiaSemana(this.value)" class="w-full min-w-0 appearance-none bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-200 outline-none focus:border-indigo-500" />
          </div>
          <div class="min-w-0">
            <label class="block text-slate-300 font-semibold mb-1">Dia da Semana</label>
            <input type="text" id="input-dia" class="w-full min-w-0 bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2.5 text-indigo-300 font-semibold outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Ordem no Culto *</label>
            <input type="number" id="input-ordem" min="1" max="20" placeholder="Ex: 1, 2, 3" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-200 outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Tom *</label>
            <select id="input-tom" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-200 outline-none focus:border-indigo-500">
              <option value="">Selecione o Tom</option>
              <optgroup label="Tons Maiores">
                <option value="C">C</option><option value="C#">C# / Db</option><option value="D">D</option><option value="Eb">Eb</option><option value="E">E</option><option value="F">F</option><option value="F#">F# / Gb</option><option value="G">G</option><option value="Ab">Ab</option><option value="A">A</option><option value="Bb">Bb</option><option value="B">B</option>
              </optgroup>
              <optgroup label="Tons Menores">
                <option value="Cm">Cm</option><option value="C#m">C#m</option><option value="Dm">Dm</option><option value="Ebm">Ebm</option><option value="Em">Em</option><option value="Fm">Fm</option><option value="F#m">F#m</option><option value="Gm">Gm</option><option value="Abm">Abm</option><option value="Am">Am</option><option value="Bbm">Bbm</option><option value="Bm">Bm</option>
              </optgroup>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-semibold mb-1">Observações (Opcional)</label>
          <input type="text" id="input-obs" placeholder="Ex: Medley com 'Ele Reina', Capotraste 2ª casa..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500" />
        </div>

        <div class="space-y-2 pt-1 border-t border-slate-800">
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Link do YouTube * (Título automático)</label>
            <input type="url" id="input-yt" required placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Link da Cifra</label>
            <input type="url" id="input-cifra" placeholder="https://www.cifraclub.com.br/..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Link da Letra</label>
            <input type="url" id="input-letra" placeholder="https://www.letras.mus.br/..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Link do Spotify</label>
            <input type="url" id="input-spotify" placeholder="https://open.spotify.com/track/..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500" />
          </div>
        </div>

        <button type="submit" id="btn-submit-louvor" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <i data-lucide="save" class="w-4 h-4"></i>
          Salvar no Repertório
        </button>
      </form>
    </div>
  </div>

  <!-- Modal 5: Gestão de Louvores do Culto -->
  <div id="modal-editar-culto" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm p-4 overflow-y-auto flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl relative my-8">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div>
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="sliders" class="w-4 h-4 text-amber-400"></i>
            Louvores do Culto
          </h3>
          <p id="label-culto-edicao" class="text-xs text-indigo-400 font-medium"></p>
        </div>
        <button onclick="fecharModalEditarCulto()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="mt-4">
        <span class="text-xs font-semibold text-slate-300 block mb-2">Louvores Escalados:</span>
        <div id="lista-louvores-culto-edicao" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>
      </div>
    </div>
  </div>

  <!-- Modal 6: Editar Louvor Item (com Observações) -->
  <div id="modal-editar-louvor-item" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm p-4 overflow-y-auto flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl relative my-8">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="edit-2" class="w-4 h-4 text-emerald-400"></i>
          Editar Louvor
        </h3>
        <button onclick="fecharModalEditarLouvorItem()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-editar-louvor" onsubmit="salvarAlteracaoLouvor(event)" class="space-y-3 mt-4 text-xs">
        <input type="hidden" id="edit-link-yt-antigo" />
        <input type="hidden" id="edit-data-alvo" />

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Ordem</label>
            <input type="number" id="edit-ordem" min="1" max="20" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Tom</label>
            <select id="edit-tom" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500">
              <optgroup label="Tons Maiores">
                <option value="C">C</option><option value="C#">C# / Db</option><option value="D">D</option><option value="Eb">Eb</option><option value="E">E</option><option value="F">F</option><option value="F#">F# / Gb</option><option value="G">G</option><option value="Ab">Ab</option><option value="A">A</option><option value="Bb">Bb</option><option value="B">B</option>
              </optgroup>
              <optgroup label="Tons Menores">
                <option value="Cm">Cm</option><option value="C#m">C#m</option><option value="Dm">Dm</option><option value="Ebm">Ebm</option><option value="Em">Em</option><option value="Fm">Fm</option><option value="F#m">F#m</option><option value="Gm">Gm</option><option value="Abm">Abm</option><option value="Am">Am</option><option value="Bbm">Bbm</option><option value="Bm">Bm</option>
              </optgroup>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-semibold mb-1">Observações</label>
          <input type="text" id="edit-obs" placeholder="Ex: Capo 2ª casa, Medley..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500" />

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzkZZmDWoNs9MzMZch5sYRgrIR9oGlgQ2j6vU2PzlnN-d1hAJG8dyfOPwuZygQri9yv/exec";
    const CACHE_KEY = "repertorio_louvor_cache";
    const PIN_ACESSO = "1234";

    let todasMusicas = [];
    let todosMembros = [];
    let todasEscalas = [];
    let diaAtual = "PROXIMO";
    let mesAtual = "TODOS";
    let dataCultoAlvo = null;
    let dataEquipeEmEdicao = null;
    let diaSemanaEquipeEmEdicao = null;
    let isAdmin = localStorage.getItem("louvor_admin_ativo") === "true";

    const NOMES_MESES = [
      "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
      "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
    ];

    const LISTA_FUNCOES_PURAS = [
      "Violão", "Voz", "Ministração", "Teclado", 
      "Bateria", "Baixo", "Guitarra", "Projeção"
    ];

    function extrairYouTubeId(url) {
      if (!url) return null;
      const match = url.toString().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    function padronizarMesAno(str) {
      if (!str) return null;
      let s = String(str).trim();

      if (s.includes("GMT") || s.includes("Horário") || s.includes("Thu") || s.includes("Mon") || s.includes("Sun")) {
        const dObj = new Date(s);
        if (!isNaN(dObj.getTime())) {
          return `${NOMES_MESES[dObj.getMonth()]}/${dObj.getFullYear()}`;
        }
        return null;
      }

      if (s.includes("/")) {
        const partes = s.split("/");
        if (partes.length === 2) {
          let m = partes[0].trim();
          const a = partes[1].trim();

          const mNum = parseInt(m, 10);
          if (!isNaN(mNum) && mNum >= 1 && mNum <= 12) {
            m = NOMES_MESES[mNum - 1];
          }

          const mCap = m.charAt(0).toUpperCase() + m.slice(1).toLowerCase();
          return `${mCap}/${a}`;
        }
      }
      return null;
    }

    function parseDataInfo(dataStr) {
      if (!dataStr) return { formatada: "", mesAno: "", chaveOrdenacao: 0, dateObj: null };
      const str = String(dataStr).trim();

      if (str.includes("GMT") || str.includes("Horário")) {
        const dObj = new Date(str);
        if (!isNaN(dObj.getTime())) {
          const d = dObj.getDate();
          const m = dObj.getMonth() + 1;
          const a = dObj.getFullYear();
          const dFmt = String(d).padStart(2, '0');
          const mFmt = String(m).padStart(2, '0');
          return {
            formatada: `${dFmt}/${mFmt}/${a}`,
            mesAno: `${NOMES_MESES[m - 1]}/${a}`,
            chaveOrdenacao: (a * 10000) + (m * 100) + d,
            dateObj: dObj
          };
        }
      }

      let d = 0, m = 0, a = 0;
      if (str.includes("/")) {
        const partes = str.split("/");
        d = parseInt(partes[0], 10);
        m = parseInt(partes[1], 10);
        a = parseInt(partes[2], 10);
      } else if (str.includes("-")) {
        const limpa = str.includes("T") ? str.split("T")[0] : str;
        const partes = limpa.split("-");
        a = parseInt(partes[0], 10);
        m = parseInt(partes[1], 10);
        d = parseInt(partes[2], 10);
      }

      if (!d || !m || !a) return { formatada: str, mesAno: "Outros", chaveOrdenacao: 0, dateObj: null };

      const dFormatado = String(d).padStart(2, '0');
      const mFormatado = String(m).padStart(2, '0');
      const nomeMes = NOMES_MESES[m - 1] || `Mês ${m}`;

      return {
        formatada: `${dFormatado}/${mFormatado}/${a}`,
        mesAno: `${nomeMes}/${a}`,
        chaveOrdenacao: (a * 10000) + (m * 100) + d,
        dateObj: new Date(a, m - 1, d)
      };
    }

    function obterCampo(obj, termos) {
      const normalizar = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
      const termosNorm = termos.map(normalizar);

      for (const chave in obj) {
        const chaveNorm = normalizar(chave);
        if (termosNorm.includes(chaveNorm) && obj[chave] !== "" && obj[chave] !== null && obj[chave] !== undefined) {
          return obj[chave];
        }
      }
      return "";
    }

    // Modo Liderança
    function alternarModoAdmin() {
      if (isAdmin) {
        if (confirm("Deseja sair do modo de liderança?")) {
          isAdmin = false;
          localStorage.removeItem("louvor_admin_ativo");
          atualizarInterfaceAdmin();
          renderizarCards();
        }
      } else {
        const pin = prompt("Digite o PIN da liderança:");
        if (pin === PIN_ACESSO) {
          isAdmin = true;
          localStorage.setItem("louvor_admin_ativo", "true");
          atualizarInterfaceAdmin();
          renderizarCards();
        } else if (pin !== null) {
          alert("PIN incorreto.");
        }
      }
    }

    function atualizarInterfaceAdmin() {
      const btnLock = document.getElementById("icon-lock");
      const painelAdmin = document.getElementById("painel-botoes-admin");

      if (isAdmin) {
        btnLock.setAttribute("data-lucide", "unlock");
        btnLock.className = "w-4 h-4 text-emerald-400";
        painelAdmin.classList.remove("hidden");
        painelAdmin.classList.add("flex");
      } else {
        btnLock.setAttribute("data-lucide", "lock");
        btnLock.className = "w-4 h-4 text-slate-400";
        painelAdmin.classList.add("hidden");
        painelAdmin.classList.remove("flex");
      }
      lucide.createIcons();
    }

    // ==========================================
    // DISPARO WHATSAPP (Links Nativos)
    // ==========================================
    function enviarLembreteCultoWhatsApp(dataCulto, diaSemana) {
      const louvoresDesteCulto = todasMusicas.filter(m => parseDataInfo(obterCampo(m, ["data", "date"])).formatada === dataCulto);

      let integrantesStr = "";
      const esc = todasEscalas.find(e => e.data === dataCulto);
      if (esc && esc.integrantes) {
        integrantesStr = esc.integrantes;
      } else if (louvoresDesteCulto.length > 0) {
        integrantesStr = obterCampo(louvoresDesteCulto[0], ["integrantes", "escala", "equipe"]) || "";
      }

      let texto = `*Lembrete de Ensaio e Culto - ${diaSemana} (${dataCulto})* \n\n`;
      texto += `Lembrando a todos que temos ensaio antes do início do culto. Não se atrasem!\n\n`;

      if (integrantesStr) {
        const listaFormatada = integrantesStr
          .split(',')
          .map(item => item.trim())
          .filter(Boolean)
          .map(item => `• ${item}`)
          .join('\n');

        texto += `👥 *Escala de Hoje:*\n${listaFormatada}\n\n`;
      }

      texto += `Cifras, letras e áudios disponíveis no app:\nhttps://repertoriolouvor.vercel.app`;

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
    }

    function dispararZapEscalaIndividual(nomeMembro) {
      if (!nomeMembro || nomeMembro === "TODOS") return;

      const mesAtualNormalizado = mesAtual.trim().toLowerCase();
      const escalasDoMembro = [];

      todasEscalas.forEach(esc => {
        const mesEscala = (padronizarMesAno(esc.mes_ano) || "").trim().toLowerCase();
        const info = parseDataInfo(esc.data);
        const mesInfo = info.mesAno.trim().toLowerCase();

        if (mesAtual === "TODOS" || mesEscala === mesAtualNormalizado || mesInfo === mesAtualNormalizado) {
          if (esc.integrantes && esc.integrantes.toLowerCase().includes(nomeMembro.toLowerCase())) {
            const match = esc.integrantes.match(new RegExp(`${nomeMembro}\\s*\\(([^)]+)\\)`, "i"));
            const funcao = match ? match[1] : "Ministério";
            escalasDoMembro.push({
              data: esc.data,
              dia: esc.dia,
              funcao: funcao,
              ordem: info.chaveOrdenacao
            });
          }
        }
      });

      if (escalasDoMembro.length === 0) {
        alert(`${nomeMembro} não possui datas escaladas neste mês.`);
        return;
      }

      escalasDoMembro.sort((a, b) => a.ordem - b.ordem);

      let texto = `*Paz, ${nomeMembro}!* \n\n`;
      texto += `Segue sua escala de louvor para *${mesAtual}*:\n\n`;

      escalasDoMembro.forEach(item => {
        texto += `*${item.data} (${item.dia})* - ${item.funcao}\n`;
      });

      texto += `\nConsulte cifras e repertório completo no aplicativo:\nhttps://repertoriolouvor.vercel.app`;

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
    }

    function dispararZapEscalaFiltrada() {
      const seletor = document.getElementById("seletor-filtro-musico");
      if (seletor && seletor.value && seletor.value !== "TODOS") {
        dispararZapEscalaIndividual(seletor.value);
      }
    }

    function enviarEscalaPrivadoSelecionado() {
      const musico = document.getElementById("escala-nome-membro").value;
      if (musico) {
        dispararZapEscalaIndividual(musico);
      }
    }

    // ==========================================
    // CONSULTA ESCALA MENSAL (Músicos)
    // ==========================================
    function abrirModalConsultaEscala() {
      const seletor = document.getElementById("seletor-filtro-musico");

      const membrosUnicos = new Set(todosMembros);
      todasEscalas.forEach(esc => {
        const partes = (esc.integrantes || "").split(",");
        partes.forEach(p => {
          const nomeMatch = p.trim().match(/^([^(]+)/);
          if (nomeMatch && nomeMatch[1].trim()) membrosUnicos.add(nomeMatch[1].trim());
        });
      });

      const lista = Array.from(membrosUnicos).sort();
      seletor.innerHTML = `<option value="TODOS">Equipe Completa (Todos os Cultos)</option>` + 
        lista.map(m => `<option value="${m}">${m}</option>`).join("");

      document.getElementById("label-mes-consulta-sub").innerText = `Mês: ${mesAtual}`;
      document.getElementById("modal-consulta-escala").classList.remove("hidden");
      renderizarVisualizacaoEscalaMensal();
    }

    function fecharModalConsultaEscala() {
      document.getElementById("modal-consulta-escala").classList.add("hidden");
    }

    function renderizarVisualizacaoEscalaMensal() {
      const filtro = document.getElementById("seletor-filtro-musico").value;
      const container = document.getElementById("container-dias-escala-mensal");
      const containerBtnZap = document.getElementById("container-btn-zap-consulta");
      const mesAtualNormalizado = mesAtual.trim().toLowerCase();

      if (containerBtnZap) {
        if (filtro !== "TODOS") {
          containerBtnZap.classList.remove("hidden");
        } else {
          containerBtnZap.classList.add("hidden");
        }
      }

      const escalasFiltradas = todasEscalas.filter(item => {
        const mesEscala = (padronizarMesAno(item.mes_ano) || "").trim().toLowerCase();
        const info = parseDataInfo(item.data);
        const mesInfo = info.mesAno.trim().toLowerCase();
        return (mesAtual === "TODOS" || mesEscala === mesAtualNormalizado || mesInfo === mesAtualNormalizado);
      });

      if (escalasFiltradas.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 py-3 text-center">Nenhuma escala cadastrada para este mês.</p>`;
        return;
      }

      escalasFiltradas.sort((a, b) => parseDataInfo(a.data).chaveOrdenacao - parseDataInfo(b.data).chaveOrdenacao);

      let html = "";
      escalasFiltradas.forEach(esc => {
        const integrantes = esc.integrantes || "";
        const estaNoCulto = filtro === "TODOS" || integrantes.toLowerCase().includes(filtro.toLowerCase());

        if (estaNoCulto) {
          let textoExibicao = integrantes;
          if (filtro !== "TODOS") {
            const regex = new RegExp(`(${filtro}\\s*\\([^)]+\\))`, "i");
            const match = integrantes.match(regex);
            textoExibicao = match ? `<span class="text-emerald-400 font-bold">${match[1]}</span>` : integrantes;
          }

          html += `
            <div class="bg-slate-800/80 border border-slate-700/60 p-3 rounded-2xl">
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-bold text-indigo-300 uppercase">${esc.dia} • ${esc.data}</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed font-medium">${textoExibicao}</p>
            </div>
          `;
        }
      });

      if (!html) {
        container.innerHTML = `<p class="text-xs text-slate-500 py-3 text-center">${filtro} não está escalado(a) neste mês.</p>`;
      } else {
        container.innerHTML = html;
      }
    }

    // ==========================================
    // CRIAR ESCALA MENSAL (Com Funções por Culto)
    // ==========================================
    function abrirModalEscalarMusico() {
      const seletorNome = document.getElementById("escala-nome-membro");
      if (todosMembros.length === 0) {
        alert("Cadastre integrantes no botão 'Músicos' primeiro.");
        return;
      }

      seletorNome.innerHTML = todosMembros.map(m => `<option value="${m}">${m}</option>`).join("");
      document.getElementById("label-mes-alvo-escala").innerText = `${mesAtual}`;
      gerarDiasDoMesParaMarcar();
      document.getElementById("modal-escalar-musico").classList.remove("hidden");
      atualizarChecksMusicoSelecionado();
    }

    function fecharModalEscalarMusico() {
      document.getElementById("modal-escalar-musico").classList.add("hidden");
    }

    function gerarDiasDoMesParaMarcar() {
      const container = document.getElementById("container-dias-para-marcar");

      let ano = new Date().getFullYear();
      let mes = new Date().getMonth();

      if (mesAtual !== "TODOS" && mesAtual.includes("/")) {
        const [nomeM, anoStr] = mesAtual.split("/");
        ano = parseInt(anoStr, 10);
        mes = NOMES_MESES.findIndex(nm => nm.toLowerCase() === nomeM.toLowerCase());
        if (mes === -1) mes = new Date().getMonth();
      }

      const totalDias = new Date(ano, mes + 1, 0).getDate();
      const diasCulto = [];
      const nomesDias = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

      for (let dia = 1; dia <= totalDias; dia++) {
        const dObj = new Date(ano, mes, dia);
        const diaSemanaIndex = dObj.getDay();
        if (diaSemanaIndex === 0 || diaSemanaIndex === 4 || diaSemanaIndex === 6) {
          const dFmt = String(dia).padStart(2, '0') + '/' + String(mes + 1).padStart(2, '0') + '/' + ano;
          diasCulto.push({
            data: dFmt,
            dia: nomesDias[diaSemanaIndex],
            mes_ano: `${NOMES_MESES[mes]}/${ano}`
          });
        }
      }

      const optsPrincipal = LISTA_FUNCOES_PURAS.map(f => `<option value="${f}">${f}</option>`).join("");
      const optsSecundaria = `<option value="">(Nenhuma)</option>` + LISTA_FUNCOES_PURAS.map(f => `<option value="${f}">${f}</option>`).join("");

      container.innerHTML = diasCulto.map((item, idx) => `
        <div class="bg-slate-800/60 border border-slate-700/50 p-2.5 rounded-2xl flex flex-col gap-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="check-dia-${idx}" data-data="${item.data}" value='${JSON.stringify(item)}' class="check-dia-escala w-4 h-4 rounded accent-amber-500 shrink-0" />
            <span class="text-xs text-slate-100 font-bold">${item.dia} • ${item.data}</span>
          </label>

          <div class="grid grid-cols-2 gap-2 pl-6">
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Principal:</span>
              <select id="funcao-p-${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-[11px] text-emerald-400 font-semibold outline-none">
                ${optsPrincipal}
              </select>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Secundária (Opcional):</span>
              <select id="funcao-s-${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-[11px] text-indigo-300 font-semibold outline-none">
                ${optsSecundaria}
              </select>
            </div>
          </div>
        </div>
      `).join("");
    }

    function atualizarChecksMusicoSelecionado() {
      const musico = document.getElementById("escala-nome-membro").value;
      if (!musico) return;

      document.querySelectorAll(".check-dia-escala").forEach((chk, idx) => {
        const dataStr = chk.getAttribute("data-data");
        const esc = todasEscalas.find(e => e.data === dataStr);
        const selP = document.getElementById(`funcao-p-${idx}`);
        const selS = document.getElementById(`funcao-s-${idx}`);

        if (esc && esc.integrantes && esc.integrantes.includes(musico)) {
          chk.checked = true;
          const match = esc.integrantes.match(new RegExp(`${musico}\\s*\\(([^)]+)\\)`));
          if (match) {
            const funcaoCompleta = match[1];
            if (funcaoCompleta.includes(" e ")) {
              const [p, s] = funcaoCompleta.split(" e ");
              if (selP) selP.value = p.trim();
              if (selS) selS.value = s.trim();
            } else {
              if (selP) selP.value = funcaoCompleta.trim();
              if (selS) selS.value = "";
            }
          }
        } else {
          chk.checked = false;
          if (selS) selS.value = "";
        }
      });
    }

    async function salvarEscalaMusicoMes(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit-escala-mes");
      btn.disabled = true;
      btn.innerText = "Gravando escala do mês...";

      const musico = document.getElementById("escala-nome-membro").value;
      const todasDatasMes = [];
      const datasMarcadas = [];

      document.querySelectorAll(".check-dia-escala").forEach((chk, idx) => {
        const obj = JSON.parse(chk.value);
        const p = document.getElementById(`funcao-p-${idx}`).value;
        const s = document.getElementById(`funcao-s-${idx}`).value;

        const funcaoCombinada = (s && s !== p) ? `${p} e ${s}` : p;

        todasDatasMes.push(obj);
        if (chk.checked) {
          datasMarcadas.push({ ...obj, funcao: funcaoCombinada });
        }
      });

      const mapaMarcadas = new Map(datasMarcadas.map(d => [d.data, d.funcao]));

      todasDatasMes.forEach(item => {
        let esc = todasEscalas.find(e => e.data === item.data);
        const estaMarcado = mapaMarcadas.has(item.data);

        if (esc) {
          let lista = (esc.integrantes || "").split(",").map(s => s.trim()).filter(Boolean);
          lista = lista.filter(s => !s.startsWith(musico + " (") && s !== musico);
          if (estaMarcado) {
            lista.push(`${musico} (${mapaMarcadas.get(item.data)})`);
          }
          esc.integrantes = lista.join(", ");
        } else if (estaMarcado) {
          todasEscalas.push({
            data: item.data,
            dia: item.dia,
            mes_ano: padronizarMesAno(item.mes_ano),
            integrantes: `${musico} (${mapaMarcadas.get(item.data)})`
          });
        }
      });

    // Leitura, Sincronização e Renderização
    function determinarCultoDestaque() {
      const datasMap = new Map();
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);

      todasMusicas.forEach(m => {
        const info = parseDataInfo(obterCampo(m, ["data", "date"]));
        if (info.dateObj && !datasMap.has(info.chaveOrdenacao)) datasMap.set(info.chaveOrdenacao, info);
      });

      todasEscalas.forEach(esc => {
        const info = parseDataInfo(esc.data);
        if (info.dateObj && !datasMap.has(info.chaveOrdenacao)) datasMap.set(info.chaveOrdenacao, info);
      });

      const datasOrdenadas = Array.from(datasMap.values()).sort((a, b) => a.chaveOrdenacao - b.chaveOrdenacao);
      if (datasOrdenadas.length === 0) return null;

      const proximoOuHoje = datasOrdenadas.find(item => item.dateObj >= hoje);
      let selecionado = proximoOuHoje ? proximoOuHoje : datasOrdenadas[datasOrdenadas.length - 1];
      const ehHoje = selecionado && selecionado.dateObj.getTime() === hoje.getTime();

      document.getElementById("label-proximo").innerText = ehHoje ? "Culto de Hoje" : "Próximo Culto";
      dataCultoAlvo = selecionado ? selecionado.formatada : null;

      if (selecionado && selecionado.mesAno) mesAtual = padronizarMesAno(selecionado.mesAno) || selecionado.mesAno;
      return selecionado;
    }

    function atualizarSeletorMeses() {
      const seletor = document.getElementById("seletor-mes");
      const mesesSet = new Set();

      todasMusicas.forEach(m => {
        const info = parseDataInfo(obterCampo(m, ["data", "date"]));
        const mesValido = padronizarMesAno(info.mesAno);
        if (mesValido) mesesSet.add(mesValido);
      });

      todasEscalas.forEach(esc => {
        const mesValido = padronizarMesAno(esc.mes_ano) || padronizarMesAno(parseDataInfo(esc.data).mesAno);
        if (mesValido) mesesSet.add(mesValido);
      });

      const meses = Array.from(mesesSet).filter(m => /^[A-Za-zÀ-ÿ]+\/\d{4}$/.test(m));

      if (meses.length === 0) {
        seletor.innerHTML = `<option value="TODOS">Todos os Meses</option>`;
        return;
      }

      let options = `<option value="TODOS">Todos os Meses</option>`;
      meses.forEach(m => {
        options += `<option value="${m}" ${m.toLowerCase() === mesAtual.toLowerCase() ? "selected" : ""}>${m}</option>`;
      });

      seletor.innerHTML = options;
      if (!meses.some(m => m.toLowerCase() === mesAtual.toLowerCase())) {
        mesAtual = meses[0];
      }
      seletor.value = mesAtual;
    }

    function mudarMes(novoMes) {

        atualizarBotoesFiltro();

    function carregarDadosIniciais() {
      atualizarInterfaceAdmin();
      const dadosLocais = localStorage.getItem(CACHE_KEY);
      if (dadosLocais) {
        try {
          const parsed = JSON.parse(dadosLocais);
          todasMusicas = parsed.repertorio || [];
          todosMembros = parsed.membros || [];
          todasEscalas = (parsed.escalas || []).map(e => ({ ...e, mes_ano: padronizarMesAno(e.mes_ano) || e.mes_ano }));
          determinarCultoDestaque();
          atualizarSeletorMeses();
          atualizarBotoesFiltro();
          renderizarCards();
        } catch (e) {
          console.error("Erro ao ler cache:", e);
        }
      }
      carregarRepertorio(false);
    }

    async function carregarRepertorio(forcado = false) {
      const iconRefresh = document.getElementById("icon-refresh");
      if (iconRefresh) iconRefresh.classList.add("animate-spin");

      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const data = await res.json();

        let rep = [];
        let mem = [];
        let esc = [];

        if (Array.isArray(data)) {
          rep = data;
        } else if (data) {
          rep = data.repertorio || [];
          mem = data.membros || [];
          esc = (data.escalas || []).map(e => ({ ...e, mes_ano: padronizarMesAno(e.mes_ano) || e.mes_ano }));
        }

        if (rep.length > 0 || mem.length > 0 || esc.length > 0) {
          todasMusicas = rep;
          todosMembros = mem;
          todasEscalas = esc;
          localStorage.setItem(CACHE_KEY, JSON.stringify({ repertorio: rep, membros: mem, escalas: esc }));
          determinarCultoDestaque();
          atualizarSeletorMeses();
          atualizarBotoesFiltro();
          renderizarCards();
        }
      } catch (err) {
        console.error("Erro na sincronização:", err);
      } finally {
        if (iconRefresh) iconRefresh.classList.remove("animate-spin");
        lucide.createIcons();
      }
    }

    function atualizarBotoesFiltro() {
      document.querySelectorAll(".filtro-btn").forEach((btn) => {
        const tipo = btn.getAttribute("data-filtro");
        if (tipo === diaAtual) {
          btn.className = "filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow-sm whitespace-nowrap transition flex items-center gap-1.5";
        } else {
          btn.className = "filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition flex items-center gap-1.5";
        }
      });
    }

    function filtrarDia(dia) {
      diaAtual = dia;
      atualizarBotoesFiltro();
      renderizarCards();
    }

    function renderizarCards() {
      const container = document.getElementById("lista-musicas");
      const mapaGrupos = {};
      const mesAtualNorm = mesAtual.trim().toLowerCase();

      // 1. Escalas cadastradas
      todasEscalas.forEach(esc => {
        const info = parseDataInfo(esc.data);
        const mesEscala = (padronizarMesAno(esc.mes_ano) || info.mesAno).trim().toLowerCase();

        const bateMes = (mesAtual === "TODOS" || mesEscala === mesAtualNorm);
        const bateDia = (diaAtual === "TODOS" || esc.dia.toLowerCase().includes(diaAtual.toLowerCase()));
        const bateProximo = (diaAtual === "PROXIMO" && info.formatada === dataCultoAlvo);

        if ((diaAtual === "PROXIMO" && bateProximo) || (diaAtual !== "PROXIMO" && bateMes && bateDia)) {
          const chave = `${info.formatada} - ${esc.dia}`;
          mapaGrupos[chave] = {
            dataTexto: info.formatada,
            diaSemana: esc.dia,
            ordemData: info.chaveOrdenacao,
            integrantes: esc.integrantes || "",
            itens: []
          };
        }
      });

      // 2. Músicas (Com proteção anti-duplicação rigorosa)
      const chavesUnicasAdicionadas = new Set();

      todasMusicas.forEach(m => {
        const info = parseDataInfo(obterCampo(m, ["data", "date"]));
        const diaSemana = obterCampo(m, ["dia", "diasemana", "dia_semana"]) || "Culto";
        const mesMusica = info.mesAno.trim().toLowerCase();

        const bateMes = (mesAtual === "TODOS" || mesMusica === mesAtualNorm);
        const bateDia = (diaAtual === "TODOS" || diaSemana.toLowerCase().includes(diaAtual.toLowerCase()));
        const bateProximo = (diaAtual === "PROXIMO" && info.formatada === dataCultoAlvo);

        if ((diaAtual === "PROXIMO" && bateProximo) || (diaAtual !== "PROXIMO" && bateMes && bateDia)) {
          const chave = `${info.formatada} - ${diaSemana}`;
          if (!mapaGrupos[chave]) {
            mapaGrupos[chave] = {
              dataTexto: info.formatada,
              diaSemana: diaSemana,
              ordemData: info.chaveOrdenacao,
              integrantes: obterCampo(m, ["integrantes", "escala", "equipe"]) || "",
              itens: []
            };
          }
          if (!mapaGrupos[chave].integrantes) {
            mapaGrupos[chave].integrantes = obterCampo(m, ["integrantes", "escala", "equipe"]) || "";
          }

          const linkYT = obterCampo(m, ["linkyoutube", "link_youtube", "youtube"]) || "";
          const ordem = obterCampo(m, ["ordem", "order"]) || "";
          const chaveItem = `${info.formatada}_${ordem}_${linkYT}`;

          if (!chavesUnicasAdicionadas.has(chaveItem)) {
            chavesUnicasAdicionadas.add(chaveItem);
            mapaGrupos[chave].itens.push(m);
          }
        }
      });

      const gruposOrdenados = Object.values(mapaGrupos).sort((a, b) => a.ordemData - b.ordemData);

      if (gruposOrdenados.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 px-4 bg-slate-900/50 border border-dashed border-slate-800 rounded-2xl">
            <i data-lucide="calendar-x" class="w-8 h-8 text-slate-600 mx-auto mb-2"></i>
            <p class="text-slate-400 text-sm font-medium">Nenhum culto ou louvor encontrado</p>
            <p class="text-slate-600 text-xs mt-0.5">Sem cultos para o filtro selecionado.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = gruposOrdenados.map(grupo => {
        grupo.itens.sort((a, b) => {
          const ordA = parseInt(obterCampo(a, ["ordem", "order"]) || 99, 10);
          const ordB = parseInt(obterCampo(b, ["ordem", "order"]) || 99, 10);
          return ordA - ordB;
        });

        let cardsHtml = "";
        if (grupo.itens.length === 0) {
          cardsHtml = `
            <div class="col-span-full py-8 px-4 bg-slate-900/40 border border-slate-800/60 rounded-2xl text-center">
              <i data-lucide="music" class="w-6 h-6 text-slate-600 mx-auto mb-2"></i>
              <p class="text-xs text-slate-400 font-medium">Escala definida, aguardando louvores da semana.</p>
            </div>
          `;
        } else {
          cardsHtml = grupo.itens.map(m => {
            const titulo = obterCampo(m, ["titulo", "título", "titulo_final", "title"]) || "Louvor sem título";
            const tom = obterCampo(m, ["tom", "tonalidade"]) || "N/D";
            const ordem = obterCampo(m, ["ordem", "order"]) ? `#${obterCampo(m, ["ordem", "order"])}` : "";
            const obs = obterCampo(m, ["observacoes", "observacao", "obs", "notas"]);

            const linkYT = obterCampo(m, ["linkyoutube", "link_youtube", "youtube", "youtube_url_final"]);
            const linkCifra = obterCampo(m, ["linkcifra", "link_cifra", "cifra"]);
            const linkLetra = obterCampo(m, ["linkletra", "link_letra", "letra"]);
            const linkSpotify = obterCampo(m, ["linkspotify", "link_spotify", "spotify"]);

            const ytId = extrairYouTubeId(linkYT) || m.youtube_id;
            const thumb = ytId
              ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`
              : "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&q=80";

            const blocoObsHtml = obs ? `
              <div class="mt-2.5 flex items-start gap-1.5 bg-amber-500/10 border border-amber-500/20 text-amber-300/90 px-2.5 py-1.5 rounded-xl text-xs font-medium">
                <i data-lucide="info" class="w-3.5 h-3.5 shrink-0 text-amber-400 mt-0.5"></i>
                <span class="leading-snug break-words">${obs}</span>
              </div>
            ` : '';

            return `
              <div class="bg-slate-900 border border-slate-800/90 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 transition flex flex-col justify-between">
                <div>
                  <div class="relative aspect-video w-full bg-slate-950">
                    <img src="${thumb}" alt="${titulo}" class="w-full h-full object-cover opacity-90" loading="lazy" />

                    ${linkYT ? `
                      <a href="${linkYT}" target="_blank" rel="noopener noreferrer" 
                         class="absolute inset-0 flex items-center justify-center bg-black/35 hover:bg-black/20 transition group">
                        <div class="w-12 h-12 rounded-full bg-red-600 text-white flex items-center justify-center shadow-lg transition transform group-hover:scale-110 active:scale-95">
                          <i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>
                        </div>
                      </a>
                    ` : ''}

                    <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
                      ${ordem ? `
                        <span class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 text-slate-200 px-2 py-0.5 rounded-md text-[11px] font-bold">
                          ${ordem}
                        </span>
                      ` : ''}
                    </div>

                    <div class="absolute top-2.5 right-2.5 bg-black/75 backdrop-blur-md border border-emerald-500/30 text-emerald-400 px-2.5 py-0.5 rounded-lg text-xs font-bold shadow">
                      Tom: ${tom}
                    </div>
                  </div>

                  <div class="p-4">
                    <h2 class="font-semibold text-slate-100 text-sm sm:text-base leading-snug line-clamp-2">
                      ${titulo}
                    </h2>
                    ${blocoObsHtml}
                  </div>
                </div>

                <div class="px-4 pb-4">
                  <div class="grid grid-cols-3 gap-2 pt-3 border-t border-slate-800/80">
                    ${linkCifra ? `
                      <a href="${linkCifra}" target="_blank" rel="noopener noreferrer" 
                         class="flex items-center justify-center gap-1.5 py-2 px-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold active:scale-95 transition">
                        <i data-lucide="music" class="w-3.5 h-3.5 text-amber-400"></i>
                        <span>Cifra</span>
                      </a>
                    ` : `
                      <div class="flex items-center justify-center py-2 px-1 rounded-xl bg-slate-950/40 border border-slate-800/50 text-slate-600 text-xs font-medium">
                        Sem Cifra
                      </div>
                    `}

                    ${linkLetra ? `
                      <a href="${linkLetra}" target="_blank" rel="noopener noreferrer" 
                         class="flex items-center justify-center gap-1.5 py-2 px-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold active:scale-95 transition">
                        <i data-lucide="file-text" class="w-3.5 h-3.5 text-sky-400"></i>
                        <span>Letra</span>
                      </a>
                    ` : `
                      <div class="flex items-center justify-center py-2 px-1 rounded-xl bg-slate-950/40 border border-slate-800/50 text-slate-600 text-xs font-medium">
                        Sem Letra
                      </div>
                    `}

                    ${linkSpotify ? `
                      <a href="${linkSpotify}" target="_blank" rel="noopener noreferrer" 
                         class="flex items-center justify-center gap-1.5 py-2 px-1 rounded-xl bg-slate-800/90 border border-emerald-500/30 hover:bg-emerald-950/30 text-emerald-300 text-xs font-semibold active:scale-95 transition">
                        <img src="Spotify.png" alt="Spotify" class="w-4 h-4 object-contain" />
                        <span class="text-white">Spotify</span>
                      </a>
                    ` : `
                      <div class="flex items-center justify-center py-2 px-1 rounded-xl bg-slate-950/40 border border-slate-800/50 text-slate-600 text-xs font-medium">
                        Sem Áudio
                      </div>
                    `}
                  </div>
                </div>
              </div>
            `;
          }).join("");
        }

        // Botões de Ação da Liderança no Culto (com botão WhatsApp compacto)
        const botoesLiderancaCulto = isAdmin ? `
          <div class="flex items-center gap-1.5">
            ${grupo.itens.length > 0 ? `
              <button onclick="abrirModalEditarCulto('${grupo.dataTexto}', '${grupo.diaSemana}')" class="text-[11px] font-bold text-amber-400 hover:text-amber-300 bg-amber-500/10 border border-amber-500/30 px-2.5 py-1 rounded-lg flex items-center gap-1 transition active:scale-95">
                <i data-lucide="edit-3" class="w-3 h-3"></i>
                Louvores
              </button>
            ` : ''}
            <button onclick="abrirModalEditarEquipeDia('${grupo.dataTexto}', '${grupo.diaSemana}')" class="text-[11px] font-bold text-emerald-400 hover:text-emerald-300 bg-emerald-500/10 border border-emerald-500/30 px-2.5 py-1 rounded-lg flex items-center gap-1 transition active:scale-95">
              <i data-lucide="users" class="w-3.5 h-3.5"></i>
              Equipe
            </button>
            <button onclick="enviarLembreteCultoWhatsApp('${grupo.dataTexto}', '${grupo.diaSemana}')" title="Avisar ensaio no grupo do WhatsApp" class="w-7 h-7 rounded-lg bg-emerald-950/60 border border-emerald-500/30 hover:bg-emerald-900/50 active:scale-95 transition flex items-center justify-center shrink-0">
              <img src="whatsapp.png" alt="WhatsApp" class="w-4 h-4 object-contain" />
            </button>
          </div>
        ` : '';

        const escalaHtml = grupo.integrantes ? `
          <div class="bg-indigo-950/40 border border-indigo-500/30 rounded-2xl p-3.5 flex items-start gap-3 shadow-md">
            <div class="w-8 h-8 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center shrink-0 text-indigo-400">
              <i data-lucide="users" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <span class="text-[11px] font-bold text-indigo-300 uppercase tracking-wider block mb-1">Escala de Músicos</span>
              <p class="text-xs text-slate-200 leading-relaxed font-medium">${grupo.integrantes}</p>
            </div>
          </div>
        ` : '';

        return `
          <section class="space-y-3 pt-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 flex-1 min-w-0">
                <div class="bg-indigo-950/70 border border-indigo-500/30 text-indigo-300 px-3.5 py-1 rounded-full text-xs font-bold tracking-wide uppercase shadow-sm truncate">
                  ${grupo.diaSemana} • ${grupo.dataTexto}
                </div>
                <div class="h-px bg-slate-800 flex-1"></div>
              </div>
              ${botoesLiderancaCulto}
            </div>
            ${escalaHtml}
            <!-- Grade Responsiva: 1 col no celular, 2 cols em tablets, 3 cols no PC -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${cardsHtml}
            </div>
          </section>
        `;
      }).join("");

      lucide.createIcons();
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") carregarRepertorio(false);
    });

    setInterval(() => carregarRepertorio(false), 30000);

    carregarDadosIniciais();
  </script>
</body>
</html>
